name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drops_do_frost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d drops_do_frost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/drops_do_frost
      REDIS_URL: redis://localhost:6379
      TZ: UTC
      PII_ENCRYPTION_KEY: MrKoZ96JWNqVn49In2Q-qXnXh3foWd2UhMZV5Vhehv0
      EMAIL_LOOKUP_HMAC_KEY: L1MyXuM7fp0ag1R6YpZvfvuI84Fj-hv48ZkWTk2wVAQ
      SESSION_TOKEN_HMAC_KEY: iM3G3CuSpZxUGNdjUCFhMFrwSXp25pqFaXn0hOOdwhU

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Typecheck (todos os pacotes)
        run: bun run typecheck

      - name: Validar regra de dependência
        run: bun run architecture:check

      - name: Testes unitários — catalog
        run: bun test
        working-directory: packages/catalog

      - name: Testes unitários — link-redirect
        run: bun test
        working-directory: packages/link-redirect

      - name: Testes unitários — identity-access
        run: bun test
        working-directory: packages/identity-access

      - name: Migrar banco — catalog
        run: bunx knex --knexfile knexfile.ts migrate:latest
        working-directory: packages/catalog

      - name: Migrar banco — link-redirect
        run: bunx knex --knexfile knexfile.ts migrate:latest
        working-directory: packages/link-redirect

      - name: Migrar banco — identity-access
        run: bunx knex --knexfile knexfile.ts migrate:latest
        working-directory: packages/identity-access

      - name: Testes de integração — api
        run: bun run test:integration
        working-directory: services/api

      - name: Lint — admin panel
        run: bun run lint
        working-directory: services/admin-panel

      - name: Typecheck — admin panel
        run: bun run typecheck
        working-directory: services/admin-panel

      - name: Testes de contrato e fluxos — admin panel
        run: bun test
        working-directory: services/admin-panel

      - name: Build — admin panel
        run: bun run build
        working-directory: services/admin-panel

      - name: Testes completos e cobertura mínima
        run: bun run test:coverage
