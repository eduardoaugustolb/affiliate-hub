name: affiliate_hub_infra

services:
  postgres_db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  affiliate_hub_db_init:
    image: postgres:16
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        psql -h postgres_db -U postgres -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname = 'affiliate-hub'"
        | grep -q 1
        || psql -h postgres_db -U postgres -d postgres -c
        'CREATE DATABASE "affiliate-hub"'
    restart: "no"
volumes:
  pg_data:
